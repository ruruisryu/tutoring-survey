# GitHub Pages 배포
# - 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
# - 저장소 Settings → Secrets and variables → Actions → Variables 탭에 공개 설정 2개 등록
#     VITE_SUPABASE_URL                  예: https://abcd1234.supabase.co
#     VITE_SUPABASE_PUBLISHABLE_KEY      sb_publishable_... (브라우저에 노출되어도 되는 공개 키)
#   서버 비밀 키(sb_secret_..., service_role)는 여기에 넣지 않는다.
# - 사용자/조직 사이트(<이름>.github.io 저장소)나 사용자 도메인을 쓰면 Variables 에 VITE_BASE_PATH=/ 를 추가한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + DB tests (PGlite)
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci
      - name: Check required variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY 변수가 없습니다. 배포된 화면은 '서버 연결 설정이 필요합니다' 안내만 보여줍니다."
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*) echo "::error::서버 비밀 키가 공개 변수에 들어 있습니다. 즉시 키를 교체하세요."; exit 1 ;;
          esac
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      - name: Check build output for secrets
        run: npm run check:secrets -- dist
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
